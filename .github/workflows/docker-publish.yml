name: Publish container image

# Publishes the standalone service image (Dockerfile, src/.../standalone.py) to
# the GitHub Container Registry.
#
# The image name follows the repository name (`github.repository`), so a
# repository rename carries the image with it and no name is duplicated here.
#
# This is how the project is distributed. It is a service, not a library: the
# image is the artifact, and there is no PyPI package.
#
# An earlier version of this comment claimed the opposite -- that the package
# was primarily a library published to PyPI, with the image merely an
# addition. That was never true: nothing of this name was ever published to
# pypi.org or test.pypi.org, and the release workflow that made the claim
# failed on every run for weeks without anyone missing its output.
#
# The sibling services (edutap.data_provider, edutap.pass_builder) carry the
# same workflow; keep the three in step.

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# A second push to the same branch supersedes the first; a half-finished build
# of an outdated commit is never worth the runner minutes.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # fetch-depth: 0, unlike the sibling workflows — this package derives its
      # version from git metadata via hatch-vcs, and a shallow checkout has no
      # tags to derive it from. The value is handed to the build below.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped on pull requests: a fork must not be able to push an image.
      # The build itself still runs, so a broken Dockerfile fails the review.
      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` only ever points at main. Deployments that pin a version
          # use the semver tags; the sha tag is the unambiguous fallback.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # `.git` is deliberately not part of the build context (.dockerignore), so
      # hatch-vcs inside the image build has nothing to read and the build would
      # fail with "setuptools-scm was unable to detect version for /app". The
      # version is therefore derived out here, where the checkout still has its
      # tags, and passed in as a build argument.
      - name: Derive the package version from git
        id: version
        run: |
          python -m pip install --quiet setuptools-scm
          echo "value=$(python -m setuptools_scm)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
