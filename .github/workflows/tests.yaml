---
name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    services:
      kafka:
        image: apache/kafka:latest
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
          KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv venv && uv pip install -e ".[test,kafka]"

      - name: Run tests with coverage
        env:
          # Der Service-Container liefert den Broker auf 9092. Ist er aus
          # irgendeinem Grund nicht erreichbar, sollen die Kafka-Tests hart
          # fehlschlagen (pytest.fail), statt still übersprungen zu werden —
          # ein Skip hier wäre eine grüne Pipeline, die das einzige
          # produktive Queue-Backend nie getestet hat.
          #
          # Der Service-Container hat KEINEN eigenen Healthcheck (das
          # apache/kafka-Image bringt dafür kein einfach nutzbares Tool mit,
          # das als GitHub-Actions-`options: --health-cmd` funktioniert).
          # Statt das im Workflow nachzubauen, pollt die kafka_settings-
          # Fixture selbst bis zu 30s in 2-s-Schritten
          # (`_wait_for_kafka_broker` in tests/conftest.py), bevor sie mit
          # TEST_REQUIRE_KAFKA=1 hart fehlschlägt — ein Broker, der beim
          # ersten Testlauf noch hochfährt, ist damit kein Flake mehr.
          EDUTAP_WEBHOOK_HEIDI_TEST_REQUIRE_KAFKA: "1"
        run: uv run pytest --cov --cov-report=

      - name: Rename coverage data
        run: mv .coverage .coverage.${{ matrix.python-version }}

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.python-version }}
          path: .coverage.${{ matrix.python-version }}
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    name: Combine & check coverage
    if: always()
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv venv && uv pip install -e ".[test]"

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine coverage & check threshold
        run: |
          uv run coverage combine
          uv run coverage html --skip-covered --skip-empty
          uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
          uv run coverage report

      - name: Upload HTML report if check failed
        uses: actions/upload-artifact@v7
        with:
          name: html-report
          path: htmlcov
        if: ${{ failure() }}
