[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "edutap.webhook-heidi"
dynamic = ["version"]
description = "Webhook endpoint and swappable pass-event queue for the eduTAP/HEIDI system"
keywords = ["wallet", "heidi", "webhook", "queue", "pass", "fastapi", "digital identity"]
readme = "README.md"
authors = [
    {name = "Alexander Loechel", email = "Alexander.Loechel@lmu.de"},
    {name = "Philipp Auersperg-Castell", email = "phil@bluedynamics.com"},
    {name = "Jens Klein", email = "jk@kleinundpartner.at"},
    {name = "Robert Niederreiter", email = "rnix@squarewave.at"},
]
requires-python = ">=3.10"
license = { text = "EUPL 1.2" }
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi",
    "pydantic>=2.0",
    "pydantic-settings",
    # The log calls in the library are structlog calls, so structlog is a core
    # dependency while edutap.observability_settings (which CONFIGURES it, along
    # with Sentry and OTLP) is an extra. structlog is pure Python and works
    # unconfigured, so a consumer that never configures it still gets output --
    # whereas stdlib logging would have left these lines outside the JSON and
    # outside the trace that the eduTAP estate reads its services through.
    "structlog>=25",
]

[project.urls]
Source = "https://github.com/edutap-eu/edutap.webhook_heidi"
Issues = "https://github.com/edutap-eu/edutap.webhook_heidi/issues"
Documentation = "https://docs.edutap.eu/packages/edutap_webhook_heidi/index.html"

[project.optional-dependencies]
# Queue backends. [kafka] is implemented and is the only backend in v1
# (decided, see docs/superpowers/specs/2026-07-13-webhook-heidi-design.md).
# [postgres]/[redis] are placeholder extras only — declared here so the
# dependency stays reserved, but there is no backend implementation behind
# them yet; they will land once a consumer actually needs them.
postgres = ["psycopg[binary,pool]>=3.1"]
kafka = ["aiokafka>=0.10"]
redis = ["redis>=5.0"]
# The standalone deployment shape (standalone.py + Dockerfile). Error reporting,
# tracing and structured logging as every eduTAP service wires them.
#
# An extra and not a core dependency: it pulls logfire and sentry-sdk, and a
# consumer that only mounts the router configures its own observability -- it
# should not inherit two backends it never asked for. The library itself needs
# nothing from it; structlog alone carries the log calls.
#
# The marker is load-bearing, not defensive. edutap.observability_settings (and
# edutap.data_models under it) require Python >=3.13, while this package
# supports >=3.10 like its sibling wallet packages. Without the marker the
# resolution fails on 3.10-3.12 before a single test runs -- the extra would
# silently narrow the package's own support window.
#
# What it means in practice: the LIBRARY runs on 3.10+, the STANDALONE service
# needs 3.13+. The image is python:3.13-slim, so it is satisfied there.
observability = [
    "edutap.observability_settings>=0.1.3,<0.2; python_version >= '3.13'",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "coverage[toml]>=7.0",
    "httpx",
    # Erzeugt das TLS-Material der mTLS-Tests (conftest.py::ssl_material).
    # Ein ssl.SSLContext laesst sich nicht sinnvoll faken -- er liest echte
    # PEM-Dateien und lehnt kaputte ab, und genau das soll der Test sehen.
    # Vorgefertigte Zertifikate im Repo waeren die Alternative; die laufen ab.
    "cryptography>=42.0",
]
develop = [
    "pdbp>=1.7.1",
]

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.hooks.vcs]
version-file = "src/edutap/webhook_heidi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/edutap"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "kafka: braucht einen laufenden Kafka-Broker (wird ohne Broker übersprungen)",
]

[tool.coverage.run]
parallel = true
source = ["edutap.webhook_heidi"]
relative_files = true
omit = ["*/_version.py"]  # von hatch-vcs generiert, nicht versioniert

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "T20",
    "UP",
    "W",
]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
]

[tool.ruff.lint.isort]
force-single-line = true
from-first = true
lines-after-imports = 2
lines-between-types = 1
no-sections = true
order-by-type = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T201"]
